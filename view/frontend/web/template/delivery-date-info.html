<!-- ko if: isVisible -->
<div class="container-info-box delivery-date">
    <span data-bind="html: message"></span>

    <!-- ko if: isOpenDeliveryDate && deliveryDates().length > 1 -->
    <span data-bind="text: 'between'"></span>
    <span
        class="deliverydate"
        data-bind="text: formatDate(deliveryDates()[0])"
    ></span>
    <span data-bind="text: 'and'"></span>
    <span
        class="deliverydate"
        data-bind="text: formatDate(deliveryDates()[1])"
    ></span>
    <!-- /ko -->

    <!-- ko if: !isOpenDeliveryDate || deliveryDates().length === 1 -->
    <span data-bind="text: 'on'"></span>
    <span
        class="deliverydate"
        data-bind="text: formatDate(deliveryDates()[0])"
    ></span>
    <!-- /ko -->
</div>
<!-- /ko -->
